services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    env_file:
      - /opt/spendlens/.env
    environment:
      POSTGRES_USER: postgres
      POSTGRES_DB: spendlens
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d spendlens"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - spendlens

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - spendlens

  api:
    image: ghcr.io/${GHCR_USER}/spendlens-api:latest
    restart: unless-stopped
    env_file:
      - /opt/spendlens/.env
    environment:
      REDIS_URL: redis://redis:6379/0
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - spendlens

  # 매일 pg_dump → backups 볼륨에 gzip 저장, 14일 보관. 복구 절차는 infra/README.md "Backup".
  backup:
    image: postgres:16-alpine
    restart: unless-stopped
    env_file:
      - /opt/spendlens/.env
    environment:
      PGHOST: postgres
      PGUSER: postgres
      PGDATABASE: spendlens
      BACKUP_KEEP_DAYS: "14"
    entrypoint:
      - sh
      - -c
      - |
        set -o pipefail
        export PGPASSWORD="$$POSTGRES_PASSWORD"
        while true; do
          f="/backups/spendlens-$$(date -u +%Y%m%dT%H%M%SZ).sql.gz"
          if pg_dump --no-owner | gzip > "$$f.tmp"; then
            mv "$$f.tmp" "$$f" && echo "backup ok: $$f ($$(du -h "$$f" | cut -f1))"
          else
            rm -f "$$f.tmp"; echo "backup FAILED" >&2
          fi
          find /backups -name 'spendlens-*.sql.gz' -mtime +$$BACKUP_KEEP_DAYS -delete
          sleep 86400
        done
    volumes:
      - postgres_backups:/backups
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - spendlens

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /opt/spendlens/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
      - caddy_logs:/var/log/caddy
    networks:
      - spendlens

networks:
  spendlens:

volumes:
  caddy_data:
  caddy_config:
  caddy_logs:
  postgres_data:
  postgres_backups:
  redis_data:
