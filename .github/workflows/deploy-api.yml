name: Deploy API

on:
  push:
    branches: [main]
    paths:
      - "apps/api/**"
      - ".github/workflows/deploy-api.yml"
      - "infra/Caddyfile"
      - "infra/docker-compose.prod.yml"
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v6

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v4

      - uses: docker/build-push-action@v6
        with:
          context: ./apps/api
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/spendlens-api:latest
            ghcr.io/${{ github.repository_owner }}/spendlens-api:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Copy Caddyfile and compose to Lightsail
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.LIGHTSAIL_HOST }}
          username: ec2-user
          key: ${{ secrets.LIGHTSAIL_SSH_KEY }}
          source: "infra/Caddyfile,infra/docker-compose.prod.yml"
          target: "/opt/spendlens/"
          strip_components: 1

      - name: SSH deploy
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.LIGHTSAIL_HOST }}
          username: ec2-user
          key: ${{ secrets.LIGHTSAIL_SSH_KEY }}
          script: |
            cd /opt/spendlens
            export GHCR_USER=${{ github.repository_owner }}
            docker compose -f docker-compose.prod.yml pull api
            docker compose -f docker-compose.prod.yml up -d
            # Caddyfile은 파일 bind mount라 scp로 교체되면 재시작해야 새 설정을 읽는다
            docker compose -f docker-compose.prod.yml restart caddy
            docker image prune -f
            # 배포 로그에 서비스 상태와 최근 백업을 남긴다 (서버 SSH 없이 확인용)
            docker compose -f docker-compose.prod.yml ps --format "{{.Service}} {{.Status}}"
            docker compose -f docker-compose.prod.yml exec -T backup sh -c 'ls -lh /backups | tail -3' || true
